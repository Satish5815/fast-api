name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirement.txt

      - name: Validate Python files
        run: python -m compileall -q app

      - name: Verify application import
        run: python -c "from app.main import app; print(app.title)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fast-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Load EC2 SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "REPOSITORY='$REPOSITORY' COMMIT_SHA='$COMMIT_SHA' EC2_APP_DIR='$EC2_APP_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          if [ -z "$EC2_APP_DIR" ]; then
            echo "EC2_APP_DIR must be configured as a repository secret" >&2
            exit 1
          fi

          if [ ! -d "$EC2_APP_DIR/.git" ]; then
            echo "Expected a git checkout at $EC2_APP_DIR" >&2
            exit 1
          fi

          cd "$EC2_APP_DIR"
          git fetch origin main
          git checkout --force main
          git reset --hard "$COMMIT_SHA"
          docker compose up --build --detach --remove-orphans
          docker compose ps
          REMOTE_SCRIPT
