name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirement.txt

      - name: Validate Python files
        run: python -m compileall -q app

      - name: Verify application import
        run: python -c "from app.main import app; print(app.title)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fast-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Load EC2 SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: latest
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "EC2_APP_DIR='$EC2_APP_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          if [ -z "$EC2_APP_DIR" ]; then
            echo "EC2_APP_DIR must be configured as a repository secret" >&2
            exit 1
          fi

          mkdir -p "$EC2_APP_DIR"
          REMOTE_SCRIPT

          scp docker-compose.yml "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/docker-compose.yml"

          ssh "$EC2_USER@$EC2_HOST" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' IMAGE_TAG='$IMAGE_TAG' EC2_APP_DIR='$EC2_APP_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          if [ -z "$EC2_APP_DIR" ]; then
            echo "EC2_APP_DIR must be configured as a repository secret" >&2
            exit 1
          fi

          if [ ! -f "$EC2_APP_DIR/docker-compose.yml" ]; then
            echo "Expected docker-compose.yml at $EC2_APP_DIR" >&2
            exit 1
          fi

          cd "$EC2_APP_DIR"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" IMAGE_TAG="$IMAGE_TAG" docker compose pull api
          DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" IMAGE_TAG="$IMAGE_TAG" docker compose up -d --force-recreate --remove-orphans
          docker compose ps
          REMOTE_SCRIPT
