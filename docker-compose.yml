services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast-api:latest
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/blog.db
    volumes:
      - api-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  api-data:
